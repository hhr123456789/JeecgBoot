<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>空压机监测面板 - 科技蓝</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
  <header class="app-header">
    <nav class="nav-tabs">
      <a class="tab" href="变压器.html">变压器</a>
      <a class="tab" href="中央空调.html">中央空调</a>
      <a class="tab active" href="#">空压机</a>
      <a class="tab" href="冷却塔.html">冷却塔</a>
      <a class="tab" href="空压机总览.html">空压机总览</a>
      <a class="tab" href="空压机工艺流程.html">空压机工艺流程</a>
    </nav>
  </header>

  <main class="container">
    <section class="top-grid">
      <div class="card photo-card">
        <div class="card-title">设备图片</div>
        <img src="./images/空压机.png" alt="空压机设备" class="device-photo">
      </div>
      <div class="card table-card">
        <div class="card-title">设备参数列表</div>
        <div class="table-wrap" role="region" aria-label="设备表格横向滚动容器">
          <table class="data-table">
            <thead>
              <tr>
                <th>序号</th>
                <th>设备类型</th>
                <th>型号</th>
                <th>排气量(m³/min)</th>
                <th>排气压力(bar)</th>
                <th>功率(kW)</th>
                <th>转速(rpm)</th>
                <th>噪音(dB)</th>
                <th>运行状态</th>
              </tr>
            </thead>
            <tbody id="device-tbody"></tbody>
          </table>
        </div>
        <div class="pagination">
          <button class="btn" id="prev-page">上一页</button>
          <span id="page-info">1 / 1</span>
          <button class="btn" id="next-page">下一页</button>
        </div>
      </div>
      <div class="card pie-card">
        <div class="card-title">排气量分布占比</div>
        <div id="pieChart" class="chart"></div>
        <div class="legend-extra">
          <div><span class="dot dot-a"></span>螺杆式 <b id="screw-count">—</b></div>
          <div><span class="dot dot-b"></span>活塞式 <b id="piston-count">—</b></div>
        </div>
      </div>
    </section>

    <section class="bottom-grid card">
      <div class="card-title">各车间空压机功率分布图</div>
      <div id="barLineChart" class="chart large"></div>
    </section>
  </main>

  <footer class="footer">© 2025 智能能源看板</footer>

  <script>
    // 空压机数据模拟
    const deviceRows = [
      { id: 1, type: '螺杆式', model: 'ATLAS-COPCO-GA22', flow: 3.7, pressure: 8, power: 22, speed: 3000, noise: 68, status: '运行' },
      { id: 2, type: '螺杆式', model: 'ATLAS-COPCO-GA37', flow: 6.2, pressure: 8, power: 37, speed: 3000, noise: 70, status: '运行' },
      { id: 3, type: '活塞式', model: 'INGERSOLL-RAND-UP6', flow: 1.8, pressure: 10, power: 11, speed: 1450, noise: 75, status: '运行' },
      { id: 4, type: '螺杆式', model: 'ATLAS-COPCO-GA55', flow: 9.8, pressure: 8, power: 55, speed: 3000, noise: 72, status: '待机' },
      { id: 5, type: '活塞式', model: 'INGERSOLL-RAND-UP15', flow: 4.2, pressure: 10, power: 15, speed: 1450, noise: 78, status: '运行' },
      { id: 6, type: '螺杆式', model: 'ATLAS-COPCO-GA75', flow: 13.1, pressure: 8, power: 75, speed: 3000, noise: 74, status: '运行' },
      { id: 7, type: '螺杆式', model: 'ATLAS-COPCO-GA110', flow: 19.2, pressure: 8, power: 110, speed: 3000, noise: 76, status: '运行' },
      { id: 8, type: '活塞式', model: 'INGERSOLL-RAND-UP30', flow: 8.5, pressure: 10, power: 30, speed: 1450, noise: 80, status: '维护' },
    ];

    // 渲染表格 + 分页
    const page = { index: 1, size: 6 };
    const tbodyEl = document.getElementById('device-tbody');
    const pageInfoEl = document.getElementById('page-info');

    function renderTable() {
      const start = (page.index - 1) * page.size;
      const end = start + page.size;
      const list = deviceRows.slice(start, end);
      tbodyEl.innerHTML = list.map(r => `
        <tr>
          <td>${r.id}</td>
          <td>${r.type}</td>
          <td>${r.model}</td>
          <td>${r.flow}</td>
          <td>${r.pressure}</td>
          <td>${r.power}</td>
          <td>${r.speed}</td>
          <td>${r.noise}</td>
          <td>${r.status}</td>
        </tr>
      `).join('');
      const total = Math.max(1, Math.ceil(deviceRows.length / page.size));
      pageInfoEl.textContent = `${page.index} / ${total}`;
    }

    document.getElementById('prev-page').addEventListener('click', () => {
      if (page.index > 1) { page.index--; renderTable(); }
    });
    document.getElementById('next-page').addEventListener('click', () => {
      const total = Math.max(1, Math.ceil(deviceRows.length / page.size));
      if (page.index < total) { page.index++; renderTable(); }
    });

    renderTable();

    // 饼图
    const pie = echarts.init(document.getElementById('pieChart'));
    const typeGroup = deviceRows.reduce((acc, r) => {
      const key = r.flow >= 10 ? '≥10m³/min' : '<10m³/min';
      acc[key] = (acc[key] || 0) + 1; return acc;
    }, {});
    document.getElementById('screw-count').textContent = `${deviceRows.filter(r => r.type.includes('螺杆')).length} 台`;
    document.getElementById('piston-count').textContent = `${deviceRows.filter(r => r.type.includes('活塞')).length} 台`;

    pie.setOption({
      backgroundColor: 'transparent',
      color: ['#69a6ff', '#1ac6ff', '#7c6dff', '#2fc59e', '#ffa940'],
      tooltip: {
        trigger: 'item',
        backgroundColor: 'rgba(255,255,255,.95)',
        borderColor: '#e6ecf5',
        textStyle: { color: '#2b3a55' }
      },
      legend: { bottom: 0, textStyle: { color: '#6b778c' } },
      series: [{
        type: 'pie', radius: ['45%', '70%'],
        center: ['50%', '45%'],
        itemStyle: { borderRadius: 6, borderColor: '#ffffff', borderWidth: 2 },
        label: { color: '#2b3a55' },
        data: Object.entries(typeGroup).map(([name, value]) => ({ name, value })),
      }]
    });

    // 堆叠柱状图
    const barLine = echarts.init(document.getElementById('barLineChart'));
    const workshops = ['车间A', '车间B', '车间C', '车间D', '车间E', '车间F', '车间G'];
    const seriesDefs = [
      { name: '22kW', color: '#69a6ff' },
      { name: '37kW', color: '#1ac6ff' },
      { name: '55kW', color: '#7c6dff' },
      { name: '75kW', color: '#2fc59e' },
      { name: '110kW', color: '#ffa940' },
    ];
    function randomData(n, base = 0, max = 3) { return Array.from({ length: n }, () => Math.floor(Math.random() * (max + 1)) + base); }

    const stackedSeries = seriesDefs.map(def => ({
      name: def.name,
      type: 'bar',
      stack: 'power',
      barWidth: 34,
      emphasis: { focus: 'series' },
      itemStyle: { color: def.color, borderRadius: [4,4,0,0] },
      label: { show: false, position: 'insideTop', color: '#4b5b77', formatter: v => (v.value ? v.value + '台' : '') },
      data: randomData(workshops.length, 0, 3),
    }));

    barLine.setOption({
      backgroundColor: 'transparent',
      color: seriesDefs.map(s => s.color),
      tooltip: {
        trigger: 'axis',
        axisPointer: { type: 'shadow' },
        backgroundColor: 'rgba(255,255,255,.95)',
        borderColor: '#e6ecf5',
        textStyle: { color: '#2b3a55' },
        formatter: params => {
          const items = params.filter(p => p.seriesType === 'bar');
          const total = items.reduce((s, p) => s + p.value * parseInt(p.seriesName), 0);
          const count = items.reduce((s, p) => s + (p.value || 0), 0);
          const lines = [`<div style="margin-bottom:6px;font-weight:600">${params[0].axisValueLabel}</div>`];
          items.forEach(p => { if (p.value) lines.push(`${p.marker}${p.seriesName}: <b>${p.value} 台</b>`); });
          lines.push(`<hr style="border:none;border-top:1px solid #eef2f7;margin:6px 0">`);
          lines.push(`设备合计: <b>${count} 台</b>`);
          lines.push(`总功率: <b>${total} kW</b>`);
          return lines.join('<br>');
        }
      },
      legend: { textStyle: { color: '#6b778c' } },
      grid: { left: 48, right: 24, bottom: 40, top: 54 },
      xAxis: {
        type: 'category', data: workshops,
        axisLine: { lineStyle: { color: '#dfe6f0' } },
        axisTick: { show: false },
        axisLabel: { color: '#6b778c' }
      },
      yAxis: [{
        type: 'value',
        axisLine: { show: false },
        splitLine: { lineStyle: { color: '#eef2f7' } },
        axisLabel: { color: '#6b778c' }
      }],
      series: [
        ...stackedSeries
      ]
    });

    // 自适应
    window.addEventListener('resize', () => { pie.resize(); barLine.resize(); });
  </script>
</body>
</html>
