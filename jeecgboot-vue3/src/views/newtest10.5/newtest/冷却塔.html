<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>冷却塔监测面板 - 科技蓝</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
  <header class="app-header">
    <nav class="nav-tabs">
      <a class="tab" href="变压器.html">变压器</a>
      <a class="tab" href="中央空调.html">中央空调</a>
      <a class="tab" href="空压机总览.html">空压机总览</a>
      <a class="tab" href="空压机工艺流程.html">空压机工艺流程</a>
      <a class="tab active" href="#">冷却塔</a>
    </nav>
  </header>

  <main class="container">
    <section class="top-grid">
      <div class="card photo-card">
        <div class="card-title">设备图片</div>
        <img src="./images/冷却塔.png" alt="冷却塔设备" class="device-photo">
      </div>
      <div class="card table-card">
        <div class="card-title">设备参数列表</div>
        <div class="table-wrap" role="region" aria-label="设备表格横向滚动容器">
          <table class="data-table">
            <thead>
              <tr>
                <th>序号</th>
                <th>设备类型</th>
                <th>型号</th>
                <th>冷却水量(m³/h)</th>
                <th>进水温度(℃)</th>
                <th>出水温度(℃)</th>
                <th>湿球温度(℃)</th>
                <th>风机功率(kW)</th>
                <th>运行状态</th>
              </tr>
            </thead>
            <tbody id="device-tbody"></tbody>
          </table>
        </div>
        <div class="pagination">
          <button class="btn" id="prev-page">上一页</button>
          <span id="page-info">1 / 1</span>
          <button class="btn" id="next-page">下一页</button>
        </div>
      </div>
      <div class="card pie-card">
        <div class="card-title">冷却水量分布占比</div>
        <div id="pieChart" class="chart"></div>
        <div class="legend-extra">
          <div><span class="dot dot-a"></span>横流式 <b id="cross-count">—</b></div>
          <div><span class="dot dot-b"></span>逆流式 <b id="counter-count">—</b></div>
        </div>
      </div>
    </section>

    <section class="bottom-grid card">
      <div class="card-title">各区域冷却塔功率分布图</div>
      <div id="barLineChart" class="chart large"></div>
    </section>
  </main>

  <footer class="footer">© 2025 智能能源看板</footer>

  <script>
    // 冷却塔数据模拟
    const deviceRows = [
      { id: 1, type: '横流式', model: 'BAC-CTI-150', flow: 150, inlet: 37, outlet: 32, wetbulb: 28, fanPower: 5.5, status: '运行' },
      { id: 2, type: '逆流式', model: 'BAC-CTI-200', flow: 200, inlet: 37, outlet: 32, wetbulb: 28, fanPower: 7.5, status: '运行' },
      { id: 3, type: '横流式', model: 'BAC-CTI-300', flow: 300, inlet: 37, outlet: 32, wetbulb: 28, fanPower: 11, status: '运行' },
      { id: 4, type: '逆流式', model: 'BAC-CTI-400', flow: 400, inlet: 37, outlet: 32, wetbulb: 28, fanPower: 15, status: '待机' },
      { id: 5, type: '横流式', model: 'BAC-CTI-500', flow: 500, inlet: 37, outlet: 32, wetbulb: 28, fanPower: 18.5, status: '运行' },
      { id: 6, type: '逆流式', model: 'BAC-CTI-600', flow: 600, inlet: 37, outlet: 32, wetbulb: 28, fanPower: 22, status: '运行' },
      { id: 7, type: '横流式', model: 'BAC-CTI-800', flow: 800, inlet: 37, outlet: 32, wetbulb: 28, fanPower: 30, status: '运行' },
      { id: 8, type: '逆流式', model: 'BAC-CTI-1000', flow: 1000, inlet: 37, outlet: 32, wetbulb: 28, fanPower: 37, status: '维护' },
    ];

    // 渲染表格 + 分页
    const page = { index: 1, size: 6 };
    const tbodyEl = document.getElementById('device-tbody');
    const pageInfoEl = document.getElementById('page-info');

    function renderTable() {
      const start = (page.index - 1) * page.size;
      const end = start + page.size;
      const list = deviceRows.slice(start, end);
      tbodyEl.innerHTML = list.map(r => `
        <tr>
          <td>${r.id}</td>
          <td>${r.type}</td>
          <td>${r.model}</td>
          <td>${r.flow}</td>
          <td>${r.inlet}</td>
          <td>${r.outlet}</td>
          <td>${r.wetbulb}</td>
          <td>${r.fanPower}</td>
          <td>${r.status}</td>
        </tr>
      `).join('');
      const total = Math.max(1, Math.ceil(deviceRows.length / page.size));
      pageInfoEl.textContent = `${page.index} / ${total}`;
    }

    document.getElementById('prev-page').addEventListener('click', () => {
      if (page.index > 1) { page.index--; renderTable(); }
    });
    document.getElementById('next-page').addEventListener('click', () => {
      const total = Math.max(1, Math.ceil(deviceRows.length / page.size));
      if (page.index < total) { page.index++; renderTable(); }
    });

    renderTable();

    // 饼图
    const pie = echarts.init(document.getElementById('pieChart'));
    const typeGroup = deviceRows.reduce((acc, r) => {
      const key = r.flow >= 500 ? '≥500m³/h' : '<500m³/h';
      acc[key] = (acc[key] || 0) + 1; return acc;
    }, {});
    document.getElementById('cross-count').textContent = `${deviceRows.filter(r => r.type.includes('横流')).length} 台`;
    document.getElementById('counter-count').textContent = `${deviceRows.filter(r => r.type.includes('逆流')).length} 台`;

    pie.setOption({
      backgroundColor: 'transparent',
      color: ['#69a6ff', '#1ac6ff', '#7c6dff', '#2fc59e', '#ffa940'],
      tooltip: {
        trigger: 'item',
        backgroundColor: 'rgba(255,255,255,.95)',
        borderColor: '#e6ecf5',
        textStyle: { color: '#2b3a55' }
      },
      legend: { bottom: 0, textStyle: { color: '#6b778c' } },
      series: [{
        type: 'pie', radius: ['45%', '70%'],
        center: ['50%', '45%'],
        itemStyle: { borderRadius: 6, borderColor: '#ffffff', borderWidth: 2 },
        label: { color: '#2b3a55' },
        data: Object.entries(typeGroup).map(([name, value]) => ({ name, value })),
      }]
    });

    // 堆叠柱状图
    const barLine = echarts.init(document.getElementById('barLineChart'));
    const areas = ['制冷站A', '制冷站B', '制冷站C', '制冷站D', '制冷站E', '制冷站F', '制冷站G'];
    const seriesDefs = [
      { name: '5.5kW', color: '#69a6ff' },
      { name: '11kW', color: '#1ac6ff' },
      { name: '15kW', color: '#7c6dff' },
      { name: '22kW', color: '#2fc59e' },
      { name: '30kW', color: '#ffa940' },
    ];
    function randomData(n, base = 0, max = 3) { return Array.from({ length: n }, () => Math.floor(Math.random() * (max + 1)) + base); }

    const stackedSeries = seriesDefs.map(def => ({
      name: def.name,
      type: 'bar',
      stack: 'power',
      barWidth: 34,
      emphasis: { focus: 'series' },
      itemStyle: { color: def.color, borderRadius: [4,4,0,0] },
      label: { show: false, position: 'insideTop', color: '#4b5b77', formatter: v => (v.value ? v.value + '台' : '') },
      data: randomData(areas.length, 0, 3),
    }));

    barLine.setOption({
      backgroundColor: 'transparent',
      color: seriesDefs.map(s => s.color),
      tooltip: {
        trigger: 'axis',
        axisPointer: { type: 'shadow' },
        backgroundColor: 'rgba(255,255,255,.95)',
        borderColor: '#e6ecf5',
        textStyle: { color: '#2b3a55' },
        formatter: params => {
          const items = params.filter(p => p.seriesType === 'bar');
          const total = items.reduce((s, p) => s + p.value * parseFloat(p.seriesName), 0);
          const count = items.reduce((s, p) => s + (p.value || 0), 0);
          const lines = [`<div style="margin-bottom:6px;font-weight:600">${params[0].axisValueLabel}</div>`];
          items.forEach(p => { if (p.value) lines.push(`${p.marker}${p.seriesName}: <b>${p.value} 台</b>`); });
          lines.push(`<hr style="border:none;border-top:1px solid #eef2f7;margin:6px 0">`);
          lines.push(`设备合计: <b>${count} 台</b>`);
          lines.push(`总功率: <b>${total.toFixed(1)} kW</b>`);
          return lines.join('<br>');
        }
      },
      legend: { textStyle: { color: '#6b778c' } },
      grid: { left: 48, right: 24, bottom: 40, top: 54 },
      xAxis: {
        type: 'category', data: areas,
        axisLine: { lineStyle: { color: '#dfe6f0' } },
        axisTick: { show: false },
        axisLabel: { color: '#6b778c' }
      },
      yAxis: [{
        type: 'value',
        axisLine: { show: false },
        splitLine: { lineStyle: { color: '#eef2f7' } },
        axisLabel: { color: '#6b778c' }
      }],
      series: [
        ...stackedSeries
      ]
    });

    // 自适应
    window.addEventListener('resize', () => { pie.resize(); barLine.resize(); });
  </script>
</body>
</html>
