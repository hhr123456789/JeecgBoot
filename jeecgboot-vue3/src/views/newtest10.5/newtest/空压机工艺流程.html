<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>空压机工艺流程 - 科技蓝</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    .page-wrap { display: grid; grid-template-columns: 1fr 360px; gap: 16px; padding: 16px 24px; }

    /* 左侧工艺流程区 */
    .process-card { position: relative; height: calc(100vh - 140px); }
    .process-stage { position: absolute; inset: 0; overflow: hidden; background: #0f1622; border-radius: 12px; border: 1px solid var(--line); }
    .process-inner { position: absolute; left: 50%; top: 50%; transform-origin: 0 0; }
    .process-img { display: block; max-width: none; user-select: none; pointer-events: none; }

    /* 设备标记点 */
    .device-pin { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .pin-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 6px rgba(22,119,255,.15); }
    .pin-label { background: rgba(255,255,255,.95); border: 1px solid var(--line); padding: 4px 8px; border-radius: 8px; font-size: 12px; color: var(--text); box-shadow: var(--shadow); }

    /* 顶部工具栏 */
    .process-toolbar { position: absolute; right: 12px; top: 12px; display: flex; gap: 8px; }
    .tool-btn { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--text); }

    /* 右侧信息面板 */
    .side-panel { background: var(--bg-card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding-bottom: 12px; height: calc(100vh - 140px); overflow: auto; }
    .panel-header { padding: 14px 16px; font-weight: 700; color: #1f3a72; border-bottom: 1px solid var(--line); background: linear-gradient(90deg, rgba(22,119,255,.10), rgba(26,198,255,.06)); }
    .kv { display: grid; grid-template-columns: 120px 1fr; gap: 8px; padding: 10px 16px; border-bottom: 1px dashed var(--line); font-size: 14px; }
    .kv .k { color: var(--text-dim); }
    .kv .v { color: var(--text); font-weight: 600; }

    /* 弹窗（复用总览页风格） */
    .modal { display: none; position: fixed; z-index: 1000; inset: 0; background: rgba(0,0,0,.45); align-items: center; justify-content: center; }
    .modal-content { background: var(--bg-card); border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.2); width: 92%; max-width: 880px; max-height: 90vh; overflow: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
    .modal-header h3 { margin: 0; font-size: 18px; color: var(--text); font-weight: 700; }
    .close-btn { background: none; border: none; font-size: 22px; color: var(--text-dim); cursor: pointer; }
    .modal-body { padding: 16px 20px; }
    .detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .detail-item { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
    .detail-label { color: var(--text-dim); font-size: 12px; margin-bottom: 4px; }
    .detail-value { color: var(--text); font-weight: 700; }
    .chart-row { margin-top: 16px; height: 260px; }

    @media (max-width: 1200px) {
      .page-wrap { grid-template-columns: 1fr; }
      .side-panel { height: auto; }
      .process-card { height: 70vh; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <nav class="nav-tabs">
      <a class="tab" href="变压器.html">变压器</a>
      <a class="tab" href="中央空调.html">中央空调</a>
      <a class="tab" href="空压机.html">空压机</a>
      <a class="tab" href="冷却塔.html">冷却塔</a>
      <a class="tab" href="空压机总览.html">空压机总览</a>
      <a class="tab active" href="#">空压机工艺流程</a>
    </nav>
  </header>

  <main class="page-wrap">
    <!-- 左：工艺流程图 -->
    <section class="card process-card">
      <div class="process-stage" id="stage">
        <div class="process-inner" id="inner" style="transform: translate(-500px,-300px) scale(1)">
          <img id="processImg" class="process-img" src="./images/空压机工艺流程图.png" alt="工艺流程图" width="1600" height="900">

          <!-- 设备标记（基于图像像素坐标定位） -->
          <div class="device-pin" data-id="AC-001" style="left: 420px; top: 560px;">
            <div class="pin-dot"></div>
            <div class="pin-label">AC-001 螺杆机</div>
          </div>
          <div class="device-pin" data-id="AC-002" style="left: 1180px; top: 360px;">
            <div class="pin-dot"></div>
            <div class="pin-label">AC-002 螺杆机</div>
          </div>
          <div class="device-pin" data-id="DRY-01" style="left: 780px; top: 520px;">
            <div class="pin-dot"></div>
            <div class="pin-label">DRY-01 干燥器</div>
          </div>
          <div class="device-pin" data-id="TANK-01" style="left: 960px; top: 640px;">
            <div class="pin-dot"></div>
            <div class="pin-label">TANK-01 储气罐</div>
          </div>
        </div>

        <div class="process-toolbar">
          <button class="tool-btn" id="zoomIn">+</button>
          <button class="tool-btn" id="zoomOut">−</button>
          <button class="tool-btn" id="resetView">⤾</button>
        </div>
      </div>
    </section>

    <!-- 右：系统概况 -->
    <aside class="side-panel">
      <div class="panel-header">系统概况</div>
      <div class="kv"><div class="k">系统状态</div><div class="v" id="sysState">运行中</div></div>
      <div class="kv"><div class="k">总功率</div><div class="v" id="sysPower">680 kW</div></div>
      <div class="kv"><div class="k">总排气量</div><div class="v" id="sysFlow">156.8 m³/min</div></div>
      <div class="kv"><div class="k">在线设备数</div><div class="v" id="onlineCount">8 台</div></div>

      <div class="panel-header">设备状态一览</div>
      <div id="deviceList"></div>
    </aside>
  </main>

  <!-- 设备详情弹窗 -->
  <div class="modal" id="devModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="devTitle">设备详情</h3>
        <button class="close-btn" id="closeModal">×</button>
      </div>
      <div class="modal-body">
        <div class="detail-grid">
          <div class="detail-item"><div class="detail-label">设备编号</div><div class="detail-value" id="d_id">—</div></div>
          <div class="detail-item"><div class="detail-label">设备类型</div><div class="detail-value" id="d_type">—</div></div>
          <div class="detail-item"><div class="detail-label">运行状态</div><div class="detail-value" id="d_status">—</div></div>
          <div class="detail-item"><div class="detail-label">排气量</div><div class="detail-value" id="d_flow">—</div></div>
          <div class="detail-item"><div class="detail-label">排气压力</div><div class="detail-value" id="d_pressure">—</div></div>
          <div class="detail-item"><div class="detail-label">排气温度</div><div class="detail-value" id="d_temp">—</div></div>
          <div class="detail-item"><div class="detail-label">功率</div><div class="detail-value" id="d_power">—</div></div>
          <div class="detail-item"><div class="detail-label">效率</div><div class="detail-value" id="d_eff">—</div></div>
        </div>
        <div id="devChart" class="chart-row"></div>
      </div>
    </div>
  </div>

  <script>
    // 模拟设备数据（与总览保持一致字段）
    const devices = [
      { id: 'AC-001', name: '螺杆式空压机', type: '螺杆式', status: '运行', flow: 6.2, pressure: 8.0, temp: 92, power: 37, efficiency: 87.5 },
      { id: 'AC-002', name: '螺杆式空压机', type: '螺杆式', status: '运行', flow: 19.2, pressure: 8.0, temp: 95, power: 110, efficiency: 91.5 },
      { id: 'DRY-01', name: '吸附式干燥器', type: '干燥器', status: '运行', flow: 25.0, pressure: 7.5, temp: 30, power: 8, efficiency: 0 },
      { id: 'TANK-01', name: '储气罐', type: '储气罐', status: '运行', flow: 0, pressure: 8.0, temp: 28, power: 0, efficiency: 0 }
    ];

    // 渲染右侧设备简表
    const listEl = document.getElementById('deviceList');
    listEl.innerHTML = devices.map(d => `
      <div class="kv">
        <div class="k">${d.id}</div>
        <div class="v">${d.status}｜${d.power}kW｜${d.pressure}bar</div>
      </div>
    `).join('');

    // 交互：点击标记打开详情
    const pins = document.querySelectorAll('.device-pin');
    pins.forEach(pin => {
      pin.addEventListener('click', () => {
        const id = pin.getAttribute('data-id');
        openDeviceModal(id);
      });
    });

    // 弹窗逻辑
    const modal = document.getElementById('devModal');
    const closeBtn = document.getElementById('closeModal');
    closeBtn.addEventListener('click', () => modal.style.display = 'none');
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });

    let devChart;
    function openDeviceModal(id) {
      const d = devices.find(x => x.id === id);
      if (!d) return;
      document.getElementById('devTitle').textContent = `${d.id} ${d.name}`;
      document.getElementById('d_id').textContent = d.id;
      document.getElementById('d_type').textContent = d.type;
      document.getElementById('d_status').textContent = d.status;
      document.getElementById('d_flow').textContent = `${d.flow} m³/min`;
      document.getElementById('d_pressure').textContent = `${d.pressure} bar`;
      document.getElementById('d_temp').textContent = `${d.temp} °C`;
      document.getElementById('d_power').textContent = `${d.power} kW`;
      document.getElementById('d_eff').textContent = d.efficiency ? `${d.efficiency}%` : '-';

      // 简单运行参数曲线（功率与压力）
      const hours = Array.from({length: 24}, (_, i) => `${i}:00`);
      const power = Array.from({length: 24}, () => Math.max(0, d.power + (Math.random()*10-5)));
      const pressure = Array.from({length: 24}, () => Math.max(6.5, d.pressure + (Math.random()*0.6-0.3)));
      if (!devChart) devChart = echarts.init(document.getElementById('devChart'));
      devChart.setOption({
        backgroundColor: 'transparent',
        tooltip: { trigger: 'axis' },
        legend: { data: ['功率(kW)', '压力(bar)'], top: 0, textStyle: { color: '#6b778c' } },
        grid: { left: 40, right: 30, bottom: 30, top: 30 },
        xAxis: { type: 'category', data: hours, axisLine: { lineStyle: { color: '#dfe6f0' } }, axisLabel: { color: '#6b778c', interval: 3 } },
        yAxis: [{ type: 'value', name: 'kW', axisLine: { show: false }, splitLine: { lineStyle: { color: '#eef2f7' } }, axisLabel: { color: '#6b778c' } },
                { type: 'value', name: 'bar', axisLine: { show: false }, splitLine: { show: false }, axisLabel: { color: '#6b778c' } }],
        series: [
          { name: '功率(kW)', type: 'line', data: power, smooth: true, lineStyle: { color: '#1677ff', width: 3 }, itemStyle: { color: '#1677ff' } },
          { name: '压力(bar)', type: 'line', yAxisIndex: 1, data: pressure, smooth: true, lineStyle: { color: '#2fc59e', width: 3 }, itemStyle: { color: '#2fc59e' } }
        ]
      });

      modal.style.display = 'flex';
    }

    // 画布缩放与拖拽
    const stage = document.getElementById('stage');
    const inner = document.getElementById('inner');
    let scale = 1;
    let origin = { x: -500, y: -300 };
    let isPanning = false; let start = { x: 0, y: 0 };

    function applyTransform() { inner.style.transform = `translate(${origin.x}px, ${origin.y}px) scale(${scale})`; }

    document.getElementById('zoomIn').addEventListener('click', () => { scale = Math.min(3, scale + 0.1); applyTransform(); });
    document.getElementById('zoomOut').addEventListener('click', () => { scale = Math.max(0.3, scale - 0.1); applyTransform(); });
    document.getElementById('resetView').addEventListener('click', () => { scale = 1; origin = { x: -500, y: -300 }; applyTransform(); });

    stage.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.1 : 0.1;
      const newScale = Math.min(3, Math.max(0.3, scale + delta));
      // 缩放中心相对位移（简单处理）
      const rect = stage.getBoundingClientRect();
      const cx = e.clientX - rect.left; const cy = e.clientY - rect.top;
      const dx = (cx - origin.x) / scale; const dy = (cy - origin.y) / scale;
      origin.x = cx - dx * newScale; origin.y = cy - dy * newScale;
      scale = newScale; applyTransform();
    }, { passive: false });

    stage.addEventListener('mousedown', (e) => { isPanning = true; start = { x: e.clientX - origin.x, y: e.clientY - origin.y }; });
    stage.addEventListener('mousemove', (e) => { if (!isPanning) return; origin.x = e.clientX - start.x; origin.y = e.clientY - start.y; applyTransform(); });
    stage.addEventListener('mouseup', () => isPanning = false);
    stage.addEventListener('mouseleave', () => isPanning = false);

    window.addEventListener('resize', () => { if (devChart) devChart.resize(); });
  </script>
</body>
</html>
